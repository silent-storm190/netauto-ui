}

.form-select:focus-visible {

.form-check {

  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;

  height: 100%;

  content: &quot;&quot;;

  width: 14px;
  height: 14px;

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);

  height: 20px;

  border-radius: var(--radius-full);

  box-shadow: none;

  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

.form-switch .form-check-input:checked {
  background: var(--primary);

.form-switch .form-check-input:checked::before {

  height: 28px;

.form-range::-webkit-slider-thumb {

  height: 20px;

.form-range:focus-visible::-webkit-slider-thumb {

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected

  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

    min-width: 44px;
    min-height: 44px;
  }

    width: 44px;
    height: 44px;
  }

    [type=&quot;week&quot;]
  ) {
    min-width: 0;

    padding-block: 8px;
  }

  .form-check {

    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }

svg {

  height: auto;
}

}

.text-warning,

    function renderRangeCalendar() {
      miniCalendar.replaceChildren();

      [&#x27;T2&#x27;, &#x27;T3&#x27;, &#x27;T4&#x27;, &#x27;T5&#x27;, &#x27;T6&#x27;, &#x27;T7&#x27;, &#x27;CN&#x27;].forEach((label) =&gt; {

        miniCalendar.appendChild(weekday);
      });

      const first = new Date(rangeState.viewYear, rangeState.viewMonth, 1, 12);
      const mondayOffset = (first.getDay() + 6) % 7;
      const cursor = new Date(rangeState.viewYear, rangeState.viewMonth, 1 - mondayOffset, 12);
      for (let index = 0; index &lt; 42; index += 1) {
        const current = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + index, 12);
        const button = document.createElement(&#x27;button&#x27;);
        button.type = &#x27;button&#x27;;
        button.textContent = String(current.getDate());
        button.dataset.date = dateKey(current);
        button.setAttribute(&#x27;aria-label&#x27;, formatDate(current));
        if (current.getMonth() !== rangeState.viewMonth) button.classList.add(&#x27;is-outside&#x27;);

        if (sameDay(current, rangeState.end)) button.classList.add(&#x27;is-end&#x27;);
        if (rangeState.end &amp;&amp; current &gt; rangeState.start &amp;&amp; current &lt; rangeState.end) button.classList.add(&#x27;is-range&#x27;);
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          if (rangeState.end) {
            rangeState.start = current;
            rangeState.end = null;
            rangeHint.textContent = &#x27;Chọn ngày kết thúc.&#x27;;
          } else {
            rangeState.end = current;
            if (rangeState.end &lt; rangeState.start) {

              rangeState.start = rangeState.end;
              rangeState.end = previousStart;
            }
            rangeHint.textContent = &#x27;Đã chọn khoảng ngày. Chọn ngày mới để bắt đầu lại.&#x27;;

          rangeState.viewYear = current.getFullYear();
          rangeState.viewMonth = current.getMonth();
          updateRangeValue();
          renderRangeCalendar();

            }, 220);

        miniCalendar.appendChild(button);
      }

    root.querySelectorAll(&#x27;[data-select-target]&#x27;).forEach((option) =&gt; {
